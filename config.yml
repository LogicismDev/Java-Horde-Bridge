# The Horde Cluster URL to use to grab populated prompts from and to submit generations to.
# This shouldn't be changed at all, unless if you run a private Horde Cluster and you know what you are doing.
clusterURL: "https://aihorde.net"

# The Backup Horde Cluster URL to use if the main Horde Cluster is down
# This shouldn't be changed at all, unless if you run a private Horde Cluster and you know what you are doing.
backupClusterURL: "https://stablehorde.net"

# An amazing, cool, awesome Horde Worker name you can specify yourself.
workerName: ""

# The worker type you must specify. If left blank, it'll auto default to text.
# Acceptable options are, text or interrogation
workerType: ""

# The KoboldAI Client URL where it can reach your worker.
# If you are running an interrogation client, you must use https://github.com/LogicismDev/HordeInterrogateAgent
# The URL can be a cloudflared, nginx, or localtunnel URL as well that is hosted on other machines (e.g. Colab).
kaiURL: ""

# The API Key that is used to uniquely identify yourself on the Horde Cluster.
# If you don't have an API Key, visit https://aihorde.net/register to grab one.
apiKey: ""

# The usernames to prioritize generations first.
# It must be formatted according to like below.
# priorityUsernames:
# - Logicism#14426
# - db0#1
# - Henk#1326
# If you have no usernames to prioritize, you must put the following format below.
# priorityUsernames: []
# Please note that your username is already prioritized.
priorityUsernames: []

# The interrogation forms to enable for the worker
interrogationForms:
  - caption
  - nsfw
  - interrogation
  - strip_background

# Enable Prompt Jobs for the text worker
# This should be true if enableChatCompletions is false!
# This will be automatically false if disableKoboldClientVerifier is true.
enablePromptJobs: true

# Enable Chat Completions for the text worker
# Please note that I am not held responsible for any actions that may be held against your horde account (such as suspensions or bans, hosting an illegal or disallowed model loaded).
enableChatCompletions: false

# Disable Kobold Client Verifiers and instead use OpenAI Compatible Endpoints to verify client.
# Set this to true if you're not using koboldcpp or any KoboldAI compatible endpoints on your AI program.
# This will be automatically disable prompt jobs if set to true.
disableKoboldClientVerifier: false

# If disableKoboldClientVerifier is set to true, you can specify the model below if you wish.
# This disables fetching the model name from the AI Program.
model: ""

# If disableKoboldClientVerifier is set to true, set the maxTokens and maxTokenLength below to the amount specified in your AI Program.
maxTokens: 512
maxTokenLength: 2048

# The chat features to enable for the text worker
# Specify which ones are supported by your AI program
chatFeatures:
  - seed
  - presence_penalty
  - frequency_penalty
  - vision
  - tools
  - json_object
  - json_schema
  - tools_with_response_format
  - reasoning_effort
  - tool_choice_enforced
  - single_tool_call_enforced
  - structured_output_enforced
  - prompt_overflow_refused

# The image transports to enable if vision is enabled in chatFeatures
# Specify which ones are supported by your AI program.
imageTransports:
  - url
  - base64